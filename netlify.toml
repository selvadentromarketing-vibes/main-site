# Netlify config — the ONLY redirects/headers source. Do not re-create
# public/_redirects: it takes precedence over this file and a stray
# `/* /index.html 200` catch-all would resurrect the duplicate-content
# problem (every URL answering 200 with the SPA shell) and kill real 404s.
#
# Every route is a physical prerendered file in dist/ (scripts/prerender.mjs),
# so no SPA fallback exists on purpose. Unknown paths fall through to
# dist/404.html, which Netlify serves with a real 404 status.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# NOTE: pretty_urls was tried here and does nothing for this site —
# Netlify's Pretty URLs strips index.html and normalises trailing slashes,
# it does NOT 301 a flat <path>.html file. Verified live: /cenotes.html
# still returned 200. Don't re-add it. The .html twins are handled by the
# X-Robots-Tag header at the bottom of this file.
# And never enable css/js/html minification: post-processing rewrites the
# markup and would strip the Suspense comment markers hydration needs.

# Legacy booking URLs (were client-side redirects; sitemap soft-404s).
[[redirects]]
  from = "/agendar"
  to = "/#contacto"
  status = 301

[[redirects]]
  from = "/en/agendar"
  to = "/en#contacto"
  status = 301

# Hashed bundle assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Subpage hero crops (generated by scripts/optimize-images.mjs).
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── The .html twins ──────────────────────────────────────────────────────
# Every route is a flat file (dist/<path>.html — deliberate: directory
# indexes made Netlify 301 every canonical URL), so Netlify serves the same
# page at BOTH /cenotes and /cenotes.html. That is 122 duplicate crawlable
# URLs, and the twin hydrates into the 404 component because the router has
# no route for a .html path.
#
# This matches on the REQUEST path, so it hits /cenotes.html and leaves
# /cenotes alone — the clean URL never ends in .html even though the file
# behind it does. The same shape as the /*.webp and /*.jpg rules above.
#
# VERIFY AFTER ANY DEPLOY THAT TOUCHES THIS BLOCK:
#   curl -sSI https://selvadentrotulum.com/cenotes.html | grep -i x-robots  → noindex
#   curl -sSI https://selvadentrotulum.com/cenotes      | grep -i x-robots  → NOTHING
# If a clean URL ever carries the header, delete this block immediately:
# it would deindex the site.
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Robots-Tag = "noindex"
